name: Basis-Sentinel Operations

on:
  repository_dispatch:
    types: [ping_scout, ping_audit]
  workflow_dispatch:

jobs:
  run_desk:
    runs-on: ubuntu-latest
    steps:
      # 🛠️ Updated to v4.2.2+ for Node 24 compatibility
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2 

      # 🛠️ Updated to v5.3.0+ for Node 24 compatibility
      - name: Setup Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Yield Scout
        env:
          GSHEETS_SECRET: ${{ secrets.GSHEETS_SECRET }}
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
        run: python scout_yield.py

      - name: Run Payout Auditor
        if: github.event.action == 'ping_audit'
        env:
          GSHEETS_SECRET: ${{ secrets.GSHEETS_SECRET }}
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
        run: python auditor_payout.py
