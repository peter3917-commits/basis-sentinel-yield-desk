name: Basis-Sentinel Operations

on:
  repository_dispatch:
    types: [ping_scout, ping_audit]
  workflow_dispatch: # 🔓 Enable the manual 'Run workflow' button

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  run_desk:
    runs-on: ubuntu-latest
    # 🔐 PERMISSIONS: Crucial for the bot to save vault_states.json
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0 

      - name: Setup Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Yield Scout
        env:
          GSHEETS_SECRET: ${{ secrets.GSHEETS_SECRET }}
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
        run: python scout_yield.py

      - name: Run Payout Auditor
        # 🛡️ V3.5 LOGIC: Run if server pings OR if you click the manual button
        if: |
          github.event.action == 'ping_audit' || 
          github.event_name == 'workflow_dispatch'
        env:
          GSHEETS_SECRET: ${{ secrets.GSHEETS_SECRET }}
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
        run: python auditor_payout.py

      # 🧠 PERSISTENT MEMORY: Preserving your original state-saving function
      - name: Commit and Push Vault State
        run: |
          git config --global user.name "Sentinel-Bot"
          git config --global user.email "actions@github.com"
          git add vault_states.json
          # Only commit if the file actually changed to avoid 'noise'
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 V3: Update Vault States [Automated]" && git push)
