name: Basis-Sentinel Operations

on:
  # 📡 Listen for external pings from Cron-job.org
  repository_dispatch:
    types: [ping_scout, ping_audit]
  
  # 🖱️ Allows you to trigger the whole desk manually if needed
  workflow_dispatch:

jobs:
  run_desk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      # 🛰️ SCOUT: Runs every time a ping comes in (Scout or Audit)
      - name: Run Yield Scout
        env:
          GSHEETS_SECRET: ${{ secrets.GSHEETS_SECRET }}
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
        run: python scout_yield.py

      # 🧾 AUDITOR: ONLY runs when the ping is specifically 'ping_audit'
      - name: Run Payout Auditor
        if: github.event.action == 'ping_audit'
        env:
          GSHEETS_SECRET: ${{ secrets.GSHEETS_SECRET }}
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
        run: python auditor_payout.py
