name: Basis-Sentinel 5-Min Scout

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [ping_basis]

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Run Yield Scout
        env:
          GSHEETS_SECRET: ${{ secrets.GSHEETS_SECRET }}
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
        run: python scout_yield.py
