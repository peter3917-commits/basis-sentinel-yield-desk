name: Basis-Sentinel Operations

on:
  repository_dispatch:
    types: [ping_scout, ping_audit]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  run_desk:
    runs-on: ubuntu-latest
    # 🔐 PERMISSIONS: Required to allow the bot to commit changes to vault_states.json
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0 # Ensures we can push back to the repo

      - name: Setup Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Yield Scout
        env:
          GSHEETS_SECRET: ${{ secrets.GSHEETS_SECRET }}
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
        run: python scout_yield.py

      - name: Run Payout Auditor
        if: github.event.action == 'ping_audit'
        env:
          GSHEETS_SECRET: ${{ secrets.GSHEETS_SECRET }}
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
        run: python auditor_payout.py

      # 🧠 PERSISTENT MEMORY STEP: Saves the 'Active/Inactive' states
      - name: Commit and Push Vault State
        run: |
          git config --global user.name "Sentinel-Bot"
          git config --global user.email "actions@github.com"
          git add vault_states.json
          # Only commit if the file actually changed to avoid empty 'noise' commits
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 V3: Update Vault States [Automated]" && git push)
